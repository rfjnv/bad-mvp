services:
  - type: web
    name: bad-mvp
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npx prisma db seed && npm run build
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        value: file:./dev.db
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
