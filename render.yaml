services:
  - type: web
    name: bad-mvp
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npx prisma generate && npx prisma migrate deploy && npx prisma db seed && npm run build
    startCommand: npm run start
    envVars:
      # Строка подключения к Neon задаётся в панели Render (Environment),
      # в блюпринт её не кладём — это пароль к базе
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
