# Планировщик напоминаний «банка заканчивается».
# На бесплатном Render нет cron, а сервис засыпает — GitHub Actions дёргает
# эндпоинт раз в час. Повторные вызовы безопасны: идемпотентность в базе.
# Секрет CRON_SECRET положить в Settings → Secrets → Actions репозитория.
name: reminders
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Разбудить Render (бесплатный план засыпает, первый запрос может отвалиться по таймауту)
        run: curl -sS --max-time 60 "https://bad-mvp.onrender.com/" -o /dev/null || true
      - name: Запустить напоминания
        run: |
          curl -sS --fail-with-body --max-time 120 --retry 3 --retry-delay 10 --retry-all-errors \
            -X POST "https://bad-mvp.onrender.com/api/cron/reminders" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
